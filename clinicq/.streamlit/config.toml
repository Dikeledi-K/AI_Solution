# ClinicQ colour theme for Streamlit's built-in widgets.
# Extra styling (gradients, cards, badges) lives in core/ui.py.
[theme]
base = "light"
primaryColor = "#0d9488"            # teal – buttons, sliders, focus rings
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#e6f4f1"
textColor = "#1e293b"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Security: never show code tracebacks (file paths, internal details) to people in the clinic.
showErrorDetails = "type"

[server]
# Security: reject forged requests from other websites (on by default; stated so nobody turns it off).
enableXsrfProtection = true
# ClinicQ has no file uploads; keep the limit small.
maxUploadSize = 5

[browser]
# Privacy: do not send usage statistics to Streamlit.
gatherUsageStats = false
